# Load backend/.env (if present) when running from the backend directory.
spring:
  application:
    name: gharse
  config:
    # Loads backend/.env (git-ignored) when present; see .env.example.
    import: optional:file:.env[.properties]
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gharse}
    username: ${DATABASE_USERNAME:gharse}
    password: ${DATABASE_PASSWORD:gharse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

gharse:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  timezone: Asia/Kolkata
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: 30
    refresh-token-days: 14
  storage:
    type: local
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:}
    max-file-bytes: 5242880
  cook:
    fssai-required: false
  order:
    cook-delivery-fee: 30.00
  rate-limit:
    enabled: true
    auth-requests-per-minute: 20
  seed:
    enabled: false
  admin-bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
